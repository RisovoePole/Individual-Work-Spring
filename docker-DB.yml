services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: "SchedulegenDB"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "oHQjGK83gXLWdhhwwQmE"
    ports:
      - "4444:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  pg_dev_data:

